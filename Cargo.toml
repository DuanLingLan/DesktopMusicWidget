[package]
name = "desktop-music-widget"
version = "1.0.3"
edition = "2021"
rust-version = "1.80"
description = "Lightweight always-on-desktop music widget for Windows"
license = "MIT"
repository = "https://github.com/DuanLingLan/DesktopMusicWidget"
readme = "README.md"
keywords = ["music", "player", "windows", "desktop", "widget"]
categories = ["multimedia::audio", "gui"]

[[bin]]
name = "desktop-music-widget"
path = "src/main.rs"

[[bin]]
name = "diag"
path = "src/bin/diag.rs"

[dependencies]
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "flac",
    "mp3",
    "mp4",
    "vorbis",
    "wav",
    "symphonia-aiff",
] }
lofty = "0.25"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.9"

# Direct2D's point/vector arguments are exposed as windows_numerics::Vector2
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Dwm",
    # D2D1_PIXEL_FORMAT / D2D1_RENDER_TARGET_PROPERTIES are gated on this
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[build-dependencies]
embed-resource = "3"
